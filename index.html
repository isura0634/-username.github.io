 <!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto Parts Pro — متجر قطع غيار</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="#" class="logo">Auto Parts <span>Pro</span></a>
      </div>

      <div class="search-area">
        <input id="searchInput" type="search" placeholder="ابحث عن قطع أو موديل..." />
      </div>

      <div class="header-actions">
        <select id="langSelect" aria-label="language">
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </select>

        <div class="view-controls">
          <select id="sortSelect" title="Sort">
            <option value="relevance">ترتيب حسب: الاكثر مناسبة</option>
            <option value="price_asc">السعر: الأقل أولاً</option>
            <option value="price_desc">السعر: الأعلى أولاً</option>
          </select>
          <button id="toggleView" class="btn-ghost" title="Toggle view">قِائم / شبكة</button>
        </div>

        <button id="chatToggle" class="chat-btn" aria-label="الدردشة">Chat</button>

        <button id="cartToggle" class="cart-btn" aria-label="عرض السلة">
          سلة (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-content">
          <h1>قطع غيار ذات جودة وموثوقية — اختَر ما يناسب سيارتك</h1>
          <p class="muted">صور واقعية لكل منتج لتتأكد من الشكل والحجم قبل الشراء.</p>
          <div class="hero-cta">
            <a href="#products" class="btn primary">تصفح المنتجات</a>
          </div>
        </div>
        <div class="hero-image">
          <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=900&auto=format&fit=crop" alt="قطع غيار سيارات">
        </div>
      </div>
    </section>

    <section id="products" class="products section">
      <div class="container">
        <div class="section-head">
          <h2>منتجاتنا</h2>
          <div class="controls-inline">
            <select id="categoryFilter">
              <option value="all">كل التصنيفات</option>
              <option value="engine">محرك</option>
              <option value="brake">فرامل</option>
              <option value="suspension">نظام تعليق</option>
              <option value="electrical">كهرباء</option>
            </select>
          </div>
        </div>

        <div id="productsGrid" class="grid grid-rows"></div>
      </div>
    </section>
  </main>

  <!-- cart panel -->
  <aside id="cartPanel" class="cart-panel" aria-hidden="true">
    <div class="cart-header">
      <h3>السلة</h3>
      <button id="closeCart" class="close-btn" aria-label="إغلاق">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="totals">
        <span>المجموع:</span> <strong id="cartTotal">0.00 ر.س</strong>
      </div>
      <button id="checkoutBtn" class="btn primary">الدفع</button>
    </div>
  </aside>

  <!-- product modal / quick view -->
  <div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-content modal-large">
      <button id="closeModal" class="close-btn" aria-label="إغلاق">×</button>
      <div class="modal-grid">
        <div class="gallery">
          <div class="main-img-wrap">
            <button id="prevImg" class="img-nav" aria-label="previous">‹</button>
            <img id="modalImage" src="" alt="صورة المنتج" loading="lazy">
            <button id="nextImg" class="img-nav" aria-label="next">›</button>
          </div>
          <div id="thumbs" class="thumbs"></div>
        </div>

        <div class="modal-info">
          <div class="meta">
            <h3 id="modalTitle"></h3>
            <div id="modalCategory" class="muted"></div>
            <div id="modalBadge" class="badge"></div>
          </div>
          <p id="modalDesc" class="muted"></p>

          <div class="modal-actions">
            <div class="price"><span id="modalPrice">0.00</span> ر.س</div>
            <div class="qty-add">
              <label>الكمية
                <input id="modalQty" type="number" min="1" value="1">
              </label>
              <button id="addToCartBtn" class="btn primary">أضف للسلة</button>
            </div>
          </div>

          <div class="info-list">
            <div><strong>رمز المنتج:</strong> <span id="modalSKU">-</span></div>
            <div><strong>الحالة:</strong> <span id="modalStock">متوفر</span></div>
            <div><strong>معلومات إضافية:</strong> <span id="modalExtra">---</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- chat panel (مخفف) -->
  <div id="chatPanel" class="chat-panel" aria-hidden="true">
    <div class="chat-header">
      <strong>الدردشة مع الدعم</strong>
      <button id="closeChat" class="close-btn">×</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" type="text" placeholder="اكتب سؤالك هنا..." autocomplete="off" />
      <button type="submit" class="btn primary">إرسال</button>
    </form>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year">2026</span> Auto Parts Pro — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
